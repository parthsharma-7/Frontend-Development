<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 2 - Google Maps Iframe</title>
</head>
<body>
    <!-- Question 2: Embed a Google Map showing your school or city using an <iframe>.
         Use title, width, height, and loading="lazy" attributes. Add a comment explaining what the loading attribute does. -->
    
    <h1>Google Maps Iframe</h1>
    
    <!-- 
    The loading="lazy" attribute tells the browser to defer loading the iframe content 
    until it's needed (when the user scrolls near it). This improves page performance 
    by reducing initial load time and bandwidth usage.
    -->
    
    <!-- Google Maps iframe for New York City with lazy loading -->
    <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d387191.033!2d-74.30932777!3d40.69767006!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c24fa5d33f083b%3A0xc80b8f06e177fe62!2sNew%20York%2C%20NY%2C%20USA!5e0!3m2!1sen!2sus!4v1234567890"
        title="Google Map showing New York City"
        width="600"
        height="450"
        loading="lazy"
        frameborder="0"
        allowfullscreen>
    </iframe>
    
    <p>This Google Maps iframe shows New York City with lazy loading enabled for better performance.</p>
</body>
</html>
