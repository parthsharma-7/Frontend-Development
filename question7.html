<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 7 - Login Form</title>
</head>
<body>
    <!-- Question 7: Build a Login Form with fields for username and password.
         Add a hidden input field with a dummy CSRF token value.
         Write an HTML comment explaining the purpose of a CSRF token. -->
    
    <h1>Login Form</h1>
    
    <!-- 
    CSRF (Cross-Site Request Forgery) Token Purpose:
    A CSRF token is a security measure used to prevent CSRF attacks. It's a unique, 
    unpredictable value that is generated by the server and included in forms. 
    When the form is submitted, the server verifies that the token matches what 
    was originally generated, ensuring that the request came from the legitimate 
    user and not from a malicious third-party website.
    -->
    
    <form action="#" method="post">
        <!-- Hidden CSRF token field -->
        <input type="hidden" name="csrf_token" value="abc123def456ghi789jkl012mno345pqr678">
        
        <!-- Username field -->
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br><br>
        
        <!-- Password field -->
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>
        
        <!-- Submit button -->
        <input type="submit" value="Login">
    </form>
    
    <p>This form includes a hidden CSRF token for security protection against cross-site request forgery attacks.</p>
</body>
</html>
