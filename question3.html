<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 3 - Two Iframes</title>
</head>
<body>
    <!-- Question 3: Create an HTML file with two iframes displayed one below another:
         The first iframe should display your introduction page.
         The second iframe should display your favorite hobby page.
         Use width and height attributes to make them look balanced. -->
    
    <h1>Two Iframes Layout</h1>
    
    <!-- First iframe displaying introduction page -->
    <iframe 
        src="introduction.html" 
        width="700" 
        height="200"
        title="Introduction Page"
        frameborder="1">
        Your browser does not support iframes.
    </iframe>
    
    <br><br>
    
    <!-- Second iframe displaying hobby page -->
    <iframe 
        src="hobby.html" 
        width="700" 
        height="200"
        title="Hobby Page"
        frameborder="1">
        Your browser does not support iframes.
    </iframe>
    
    <p>Above are two balanced iframes displaying my introduction and hobby information.</p>
</body>
</html>
