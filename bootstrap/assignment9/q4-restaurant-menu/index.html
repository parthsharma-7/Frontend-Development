<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Cuisine - Today's Menu</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <!-- Restaurant Header -->
        <header class="text-center mb-5">
            <h1 class="display-4">La Cuisine</h1>
            <p class="lead">Today's Special Menu</p>
        </header>

        <div class="row">
            <!-- Menu Table -->
            <div class="col-md-8">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Item</th>
                            <th>Category</th>
                            <th class="text-end">Price</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>French Onion Soup</td>
                            <td>Appetizer</td>
                            <td class="text-end">$8.99</td>
                        </tr>
                        <tr>
                            <td>Grilled Salmon</td>
                            <td>Main Course</td>
                            <td class="text-end">$24.99</td>
                        </tr>
                        <tr>
                            <td>Beef Bourguignon</td>
                            <td>Main Course</td>
                            <td class="text-end">$26.99</td>
                        </tr>
                        <tr>
                            <td>Crème Brûlée</td>
                            <td>Dessert</td>
                            <td class="text-end">$9.99</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Chef's Specials -->
            <div class="col-md-4">
                <div class="card">
                    <img src="https://via.placeholder.com/400x300" class="img-fluid" alt="Chef's Special">
                    <div class="card-body">
                        <h5 class="card-title">Chef's Specials</h5>
                        <div class="list-group">
                            <a href="#" class="list-group-item list-group-item-action">
                                <div class="d-flex w-100 justify-content-between">
                                    <h6 class="mb-1">Truffle Risotto</h6>
                                    <small class="text-muted">$29.99</small>
                                </div>
                                <small>With wild mushrooms</small>
                            </a>
                            <a href="#" class="list-group-item list-group-item-action">
                                <div class="d-flex w-100 justify-content-between">
                                    <h6 class="mb-1">Duck Confit</h6>
                                    <small class="text-muted">$32.99</small>
                                </div>
                                <small>With orange sauce</small>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
