<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications Dashboard</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <!-- Dashboard Header -->
        <header class="mb-4">
            <h1 class="text-center mb-4">Notifications Dashboard</h1>
        </header>

        <!-- Alerts Container -->
        <div class="card shadow-sm">
            <div class="card-body">
                <!-- Success Alert -->
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    <strong>New Message!</strong> You have received a new project proposal.
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Info Alert -->
                <div class="alert alert-info" role="alert">
                    <strong>Tip:</strong> Remember to update your profile information regularly.
                </div>

                <!-- Danger Alert -->
                <div class="alert alert-danger" role="alert">
                    <strong>Warning!</strong> Your subscription will expire in 3 days.
                </div>

                <!-- Summary Well -->
                <div class="bg-light p-4 rounded mt-4">
                    <h4 class="mb-3">Summary</h4>
                    <ul class="list-unstyled">
                        <li>📬 3 Unread Messages</li>
                        <li>🔔 2 Pending Notifications</li>
                        <li>⚠️ 1 Important Alert</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
