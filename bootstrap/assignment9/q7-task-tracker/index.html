<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <!-- Header with Counter -->
        <header class="text-center mb-4">
            <h1>Task Tracker</h1>
            <span class="badge bg-warning">5 Pending Tasks</span>
        </header>

        <!-- Task List -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="list-group">
                    <!-- Task 1 -->
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-1">Update Website Content</h5>
                            <small class="text-muted">Due: Tomorrow</small>
                        </div>
                        <div>
                            <span class="badge bg-danger me-2">High</span>
                            <button class="btn btn-success btn-sm">
                                Complete <span class="badge bg-white text-success">✓</span>
                            </button>
                        </div>
                    </div>

                    <!-- Task 2 -->
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-1">Review Project Proposal</h5>
                            <small class="text-muted">Due: Next Week</small>
                        </div>
                        <div>
                            <span class="badge bg-warning me-2">Medium</span>
                            <button class="btn btn-success btn-sm">
                                Complete <span class="badge bg-white text-success">✓</span>
                            </button>
                        </div>
                    </div>

                    <!-- Task 3 -->
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-1">Schedule Team Meeting</h5>
                            <small class="text-muted">Due: Today</small>
                        </div>
                        <div>
                            <span class="badge bg-info me-2">Low</span>
                            <button class="btn btn-success btn-sm">
                                Complete <span class="badge bg-white text-success">✓</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
