<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Assignment7 - Q1 Borders and Padding</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><h1>Borders & Padding Demo</h1></header>
  <main class="wrap">
    <div class="box solid">Solid border<br><span class="note">padding:16px</span></div>
    <div class="box dashed">Dashed border<br><span class="note">padding:12px; border-radius:8px</span></div>
    <div class="box double">Double border<br><span class="note">padding:20px; border-radius:12px</span></div>
    <div class="box groove">Groove border<br><span class="note">padding:8px; border-radius:4px</span></div>
  </main>
  <footer>Hover a box to change the border color</footer>
</body>
</html>
