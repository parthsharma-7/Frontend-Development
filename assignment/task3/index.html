<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Task 3 - Multi-Step Form</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .step { display: none; }
    .step.active { display: block; }
    .buttons { margin-top: 15px; }
    input { padding: 6px; width: 250px; }
    .error { color: red; margin-top: 5px; }
    #summary { display: none; border: 1px solid #ccc; padding: 10px; margin-top: 15px; }
  </style>
</head>
<body>
  <h1>Multi-Step Form</h1>

  <div id="form-container">
    <div class="step active" data-step="1">
      <h2>Step 1: Name</h2>
      <input id="name" type="text" placeholder="Enter your name" />
      <div id="error-step-1" class="error"></div>
    </div>

    <div class="step" data-step="2">
      <h2>Step 2: Email</h2>
      <input id="email" type="email" placeholder="Enter your email" />
      <div id="error-step-2" class="error"></div>
    </div>

    <div class="step" data-step="3">
      <h2>Step 3: Password</h2>
      <input id="password" type="password" placeholder="Enter your password" />
      <div id="error-step-3" class="error"></div>
    </div>

    <div class="buttons">
      <button id="back-btn" disabled>Back</button>
      <button id="next-btn">Next</button>
    </div>
  </div>

  <div id="summary">
    <h2>Summary</h2>
    <p id="summary-text"></p>
  </div>

  <script>
    const steps = Array.from(document.querySelectorAll('.step'));
    const backBtn = document.getElementById('back-btn');
    const nextBtn = document.getElementById('next-btn');
    const summaryDiv = document.getElementById('summary');
    const summaryText = document.getElementById('summary-text');

    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    let currentStep = 1;

    function showStep(step) {
      steps.forEach((s) => {
        s.classList.toggle('active', Number(s.dataset.step) === step);
      });
      backBtn.disabled = step === 1;
      nextBtn.textContent = step === 3 ? 'Finish' : 'Next';
    }

    function validateStep(step) {
      let valid = true;
      document.getElementById(`error-step-${step}`).textContent = '';

      if (step === 1) {
        if (!nameInput.value.trim()) {
          valid = false;
          document.getElementById('error-step-1').textContent = 'Name is required.';
        }
      } else if (step === 2) {
        const email = emailInput.value.trim();
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
          valid = false;
          document.getElementById('error-step-2').textContent = 'Enter a valid email.';
        }
      } else if (step === 3) {
        if (passwordInput.value.length < 6) {
          valid = false;
          document.getElementById('error-step-3').textContent = 'Password must be at least 6 characters.';
        }
      }
      return valid;
    }

    backBtn.addEventListener('click', () => {
      if (currentStep > 1) {
        currentStep--;
        showStep(currentStep);
      }
    });

    nextBtn.addEventListener('click', () => {
      if (!validateStep(currentStep)) return;

      if (currentStep < 3) {
        currentStep++;
        showStep(currentStep);
      } else {
        // All 3 steps complete - show summary
        document.getElementById('form-container').style.display = 'none';
        summaryText.textContent = `Name: ${nameInput.value}, Email: ${emailInput.value}, Password length: ${passwordInput.value.length}`;
        summaryDiv.style.display = 'block';
      }
    });

    showStep(currentStep);
  </script>
</body>
</html>
