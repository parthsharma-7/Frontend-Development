<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 17 - Form Page</title>
</head>
<body>
    <!-- Question 17: Create two HTML files:
         form.html → Contains a form with a text input and a submit button.
         result.html → Displays a message "Form successfully submitted."
         Use an <iframe> in form.html to load result.html after clicking Submit. -->
    
    <h1>Form with Iframe Result</h1>
    
    <!-- Form with text input -->
    <form action="question17_result.html" method="get" target="resultFrame">
        <label for="textInput">Enter some text:</label><br>
        <input type="text" id="textInput" name="textInput" placeholder="Type something here..." required><br><br>
        
        <input type="submit" value="Submit">
    </form>
    
    <br>
    
    <!-- Iframe to display result -->
    <iframe 
        name="resultFrame" 
        src="" 
        width="600" 
        height="200"
        frameborder="1">
        Your browser does not support iframes.
    </iframe>
    
    <p>After clicking Submit, the result will be displayed in the iframe above.</p>
</body>
</html>
