<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 6 - User Registration Form</title>
</head>
<body>
    <!-- Question 6: Create a User Registration Form with the following fields:
         Full Name, Email Address, Password, Confirm Password
         Make all fields required using the required attribute. -->
    
    <h1>User Registration Form</h1>
    
    <form action="#" method="post">
        <!-- Full Name field -->
        <label for="fullName">Full Name:</label><br>
        <input type="text" id="fullName" name="fullName" required><br><br>
        
        <!-- Email Address field -->
        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" required><br><br>
        
        <!-- Password field -->
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>
        
        <!-- Confirm Password field -->
        <label for="confirmPassword">Confirm Password:</label><br>
        <input type="password" id="confirmPassword" name="confirmPassword" required><br><br>
        
        <!-- Submit button -->
        <input type="submit" value="Register">
    </form>
    
    <p>All fields are required and must be filled out to submit the form.</p>
</body>
</html>
