<html lang="en">
<head>
<meta charset="UTF-8">
<title>BMI Calculator</title>

    #bar {
        width: 100%;
        height: 20px;
        background: #ddd;
        border-radius: 10px;
        margin-top: 20px;
    }
    #progress {
        height: 20px;
        width: 0%;
        background: green;
        border-radius: 10px;
        transition: 0.5s;
    }
</style>
</head>
<body>

<div class="container">
    <h2>BMI Calculator</h2>

    <input type="number" id="weight" placeholder="Enter weight (kg)">
    <input type="number" id="height" placeholder="Enter height (m)">
    <button onclick="calculateBMI()">Calculate</button>

    <h3 id="result"></h3>

    <div id="bar">
        <div id="progress"></div>
    </div>
</div>

<script>
function calculateBMI() {
    let weight = parseFloat(document.getElementById("weight").value);
    let height = parseFloat(document.getElementById("height").value);

   

    let bmi = weight / (height * height);
    let resultText = "";

    
    if (bmi < 18.5) resultText = "Underweight 😔";
    else if (bmi >= 18.5 && bmi < 24.9) resultText = "Normal 😊";
    else if (bmi >= 25 && bmi < 29.9) resultText = "Overweight 😕";
    else resultText = "Obese 😟";

    document.getElementById("result").innerHTML = `BMI = ${bmi.toFixed(2)} – ${resultText}`;

    
    let barValue = (bmi / 40) * 100;
    let progress = document.getElementById("progress");

    progress.style.width = barValue + "%";

    if (bmi < 18.5) progress.style.background = "yellow";
    else if (bmi < 24.9) progress.style.background = "green";
    else if (bmi < 29.9) progress.style.background = "orange";
    else progress.style.background = "red";
}
</script>

</body>
