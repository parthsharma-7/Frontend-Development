<!DOCTYPE html>
<html>
<head>
    <title>Grocery Bill Calculator</title>
</head>
<body>
    <h2>Grocery Bill Calculator</h2>

    <label>Price per item:</label>
    <input type="number" id="price" placeholder="Enter price"><br><br>

    <label>Quantity:</label>
    <input type="number" id="qty" placeholder="Enter quantity"><br><br>

    <button onclick="calculateBill()">Calculate Bill</button>

    <h3 id="result"></h3>

    <script>
        function calculateBill() {
            let price = parseFloat(document.getElementById("price").value);
            let qty = parseInt(document.getElementById("qty").value);

            let total = price * qty; 
            let finalAmount = total;

            
            if (total > 1000) {
                finalAmount = total - (total * 0.10); 
            }

            document.getElementById("result").innerHTML =
                "Final Amount: ₹" + finalAmount.toFixed(2);
        }
    </script>
</body>
</html>
