<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 11 - Student Information Form</title>
</head>
<body>
    <!-- Question 11: Design a form that collects student information — Name, Roll Number, and Course.
         Use a <select> dropdown for choosing a course.
         Include an option that says "Select Course" as default (disabled and selected). -->
    
    <h1>Student Information Form</h1>
    
    <form action="#" method="post">
        <!-- Name field -->
        <label for="studentName">Name:</label><br>
        <input type="text" id="studentName" name="studentName" required><br><br>
        
        <!-- Roll Number field -->
        <label for="rollNumber">Roll Number:</label><br>
        <input type="text" id="rollNumber" name="rollNumber" required><br><br>
        
        <!-- Course dropdown -->
        <label for="course">Course:</label><br>
        <select id="course" name="course" required>
            <!-- Default disabled option -->
            <option value="" disabled selected>Select Course</option>
            <option value="computer-science">Computer Science</option>
            <option value="information-technology">Information Technology</option>
            <option value="electronics">Electronics Engineering</option>
            <option value="mechanical">Mechanical Engineering</option>
            <option value="civil">Civil Engineering</option>
            <option value="business-administration">Business Administration</option>
            <option value="mathematics">Mathematics</option>
            <option value="physics">Physics</option>
        </select><br><br>
        
        <!-- Submit button -->
        <input type="submit" value="Submit Information">
    </form>
    
    <p>Please fill in all the required information. Select your course from the dropdown menu.</p>
</body>
</html>
