<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q1 - Welcome Page Greeting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <header>
    <h1 id="main-title">Welcome to Our Site</h1>
  </header>

  <main>
    <section aria-labelledby="greeting-heading">
      <h2 id="greeting-heading">Greeting</h2>
      <p id="greeting-text">Loading greeting...</p>
      <p id="welcome-message">We are glad to have you here. Enjoy browsing!</p>
      <button id="change-greeting-btn">Change Greeting</button>
      <button id="toggle-welcome-btn">Toggle Welcome Message</button>
    </section>

    <section aria-labelledby="info-heading">
      <h2 id="info-heading">Information</h2>
      <p>Click the greeting text to see an alert.</p>
      <p>Use the buttons above to interact with the page.</p>
      <p>Time-based greeting appears automatically on page load.</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 My jQuery Assignment</p>
  </footer>

  <script src="q1.js"></script>
</body>
</html>
