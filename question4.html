<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 4 - Frameset Layout</title>
</head>

<!-- Question 4: Create a frameset layout using <frameset> and <frame> tags:
     Top frame → Navigation links (Home, About, Contact)
     Bottom frame → Displays a message "Welcome to My Website" -->

<frameset rows="20%,80%">
    <!-- Top frame for navigation -->
    <frame src="navigation.html" name="topFrame" scrolling="no">
    
    <!-- Bottom frame for welcome message -->
    <frame src="welcome.html" name="bottomFrame">
    
    <!-- Fallback content for browsers that don't support frames -->
    <noframes>
        <body>
            <h1>Frameset Layout</h1>
            <p>Your browser does not support frames. Please upgrade to a modern browser.</p>
            
            <!-- Navigation fallback -->
            <h3>Navigation</h3>
            <a href="#">Home</a> | 
            <a href="#">About</a> | 
            <a href="#">Contact</a>
            
            <!-- Welcome message fallback -->
            <h2>Welcome to My Website</h2>
        </body>
    </noframes>
</frameset>
</html>
