<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Q2 — Tooltip Demonstration</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="center">
    <h1>Tooltip Demonstration</h1>
    <p class="lead">Hover the items to see pure-CSS tooltips (opacity transition 0.3s).</p>

    <div class="items">
      <div class="tip">
        <span class="trigger">Icon A</span>
        <span class="tooltip">Tooltip for Icon A</span>
      </div>
      <div class="tip">
        <span class="trigger">Icon B</span>
        <span class="tooltip">Another helpful tooltip</span>
      </div>
      <div class="tip">
        <span class="trigger">Word</span>
        <span class="tooltip">Tooltip on word</span>
      </div>
    </div>
  </main>
</body>
</html>
