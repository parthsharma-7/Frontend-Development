<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Q1 — Pseudo-Classes Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><h1>Pseudo-Classes Demo</h1></header>
  <main class="wrap">
    <section class="examples">
      <div class="item">
        <h2>Links</h2>
        <p class="explain">Hover and focus change color.</p>
        <nav class="links">
          <a href="#">Home</a>
          <a href="#">About</a>
          <a href="#">Contact</a>
        </nav>
      </div>

      <div class="item">
        <h2>Buttons</h2>
        <p class="explain">:hover, :active, :focus are shown on buttons.</p>
        <div class="btns">
          <button>Normal</button>
          <button>Hover / Active</button>
          <button>Focus me</button>
        </div>
      </div>

      <div class="item">
        <h2>List (nth-child)</h2>
        <p class="explain">Striped styling using <code>:nth-child()</code>.</p>
        <ul class="list">
          <li>List 1</li>
          <li>List 2</li>
          <li>List 3</li>
          <li>List 4</li>
        </ul>
      </div>
    </section>
  </main>
  <footer>Assignment 8 — Q1</footer>
</body>
</html>
