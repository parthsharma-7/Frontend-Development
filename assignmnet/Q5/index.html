<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Q5 - Movie Ticket Booking</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    form { max-width: 400px; margin-bottom: 20px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; }
    input { width: 100%; padding: 6px 8px; box-sizing: border-box; }
    .error { color: red; font-size: 0.85rem; }
    .invalid { border: 2px solid red; }
    .valid { border: 2px solid green; }
    #ticketDetails { background: #f4f4f4; padding: 10px; }
  </style>
</head>
<body>
  <h1>Q5: Movie Ticket Booking</h1>

  <form id="bookingForm" novalidate>
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" />
      <div id="nameError" class="error"></div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" />
      <div id="emailError" class="error"></div>
    </div>

    <div class="form-group">
      <label for="seats">Seats (1-10)</label>
      <input type="number" id="seats" name="seats" min="1" max="10" />
      <div id="seatsError" class="error"></div>
    </div>

    <button type="submit">Book Ticket</button>
  </form>

  <h3>Ticket Details</h3>
  <div id="ticketDetails"></div>

  <script src="q5.js"></script>
</body>
</html>
