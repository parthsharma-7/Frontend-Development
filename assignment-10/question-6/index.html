<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Assignment 10 - Q6 User Registration</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    form { max-width: 300px; display: flex; flex-direction: column; gap: 8px; }
    label { display: flex; flex-direction: column; font-size: 14px; }
    button { margin-top: 8px; }
    #message { margin-top: 10px; font-weight: bold; }
    .error { color: red; }
    .success { color: green; }
  </style>
</head>
<body>
  <h1>Q6 - User Registration With Duplicate Check (Axios + GET + POST)</h1>
  <p>JSON Server: <code>json-server --watch db.json --port 3006</code></p>

  <form id="regForm">
    <label>
      Name
      <input type="text" id="name" required />
    </label>
    <label>
      Email
      <input type="email" id="email" required />
    </label>
    <label>
      Password
      <input type="password" id="password" required />
    </label>
    <button type="submit">Register</button>
  </form>

  <div id="message"></div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
