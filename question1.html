<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 1 - YouTube Video Iframe</title>
</head>
<body>
    <!-- Question 1: Create an HTML file that embeds a YouTube video using an <iframe>.
         Set the width and height using only percentage values to make it adjust when resizing the browser. -->
    
    <h1>YouTube Video Iframe</h1>
    
    <!-- YouTube video iframe with percentage width and height for responsive design -->
    <iframe 
        src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
        width="80%" 
        height="450"
        title="YouTube Video Player"
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
    </iframe>
    
    <p>This iframe uses percentage width (80%) to make it responsive when resizing the browser window.</p>
</body>
</html>
