<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Animations</title>
    <link rel="stylesheet" href="loading-animations.css">
</head>
<body>
    <div class="loading-container">
        <div class="loader-item pulse-loader">
            <div class="pulse"></div>
            <p>Pulse</p>
        </div>

        <div class="loader-item spinner-loader">
            <div class="spinner"></div>
            <p>Spinner</p>
        </div>

        <div class="loader-item dots-loader">
            <div class="dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <p>Dots</p>
        </div>

        <div class="loader-item progress-loader">
            <div class="progress-bar">
                <div class="progress"></div>
            </div>
            <p>Progress</p>
        </div>

        <div class="loader-item wave-loader">
            <div class="wave">
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
            </div>
            <p>Wave</p>
        </div>
    </div>
</body>
</html>
