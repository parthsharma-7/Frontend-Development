<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
    <main>
        <header>
            <h1>Responsive Image Filter Gallery</h1>
        </header>
        <section class="gallery">
            <figure class="blur">
                <img src="https://images.unsplash.com/photo-1503023345310-bd7c1de61c7d?w=800&q=60" alt="Nature 1">
                <figcaption>Blur Effect</figcaption>
            </figure>
            <figure class="grayscale">
                <img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d?w=800&q=60" alt="Nature 2">
                <figcaption>Grayscale Effect</figcaption>
            </figure>
            <figure class="sepia">
                <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=800&q=60" alt="Nature 3">
                <figcaption>Sepia Effect</figcaption>
            </figure>
            <figure class="brightness">
                <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=800&q=60" alt="Nature 4">
                <figcaption>Brightness Effect</figcaption>
            </figure>
            <figure class="contrast">
                <img src="https://images.unsplash.com/photo-1495567720989-cebdbdd97913?w=800&q=60" alt="Nature 5">
                <figcaption>Contrast Effect</figcaption>
            </figure>
            <figure class="hue">
                <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800&q=60" alt="Nature 6">
                <figcaption>Hue-Rotate Effect</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
